name: Dual C3 candidate (hardware acceptance pending)
on:
  push:
    branches: [codex/upstream-dual-modem]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python tools/test_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-regressions
          path: build/regression/
  build:
    needs: host-regressions
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v7
      - name: Build fixed SDK and upstream patches
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/apply_idf_patches.py --idf-path "$IDF_PATH"
          python -m unittest discover -s tools/tests -v
          idf.py -B build/idf6 -D SDKCONFIG=build/sdkconfig.idf6 build
          python tools/package_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: dual-c3-candidate-not-hardware-accepted
          path: dist/
          retention-days: 14
