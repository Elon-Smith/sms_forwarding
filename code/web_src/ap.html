<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFi 配网 · SMS Forwarding</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%2222%2028%20210%20210%22%3E%3Cstyle%3Esvg%7Bcolor%3A%23111%7D%40media%28prefers-color-scheme%3Adark%29%7Bsvg%7Bcolor%3Awhite%7D%7D%3C%2Fstyle%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%20%20%20%20%20%20%20%20%20%20%3Cpath%20d%3D%22M73%2042%20H183%20C204%2042%20219%2057%20219%2080%20V146%20C219%20169%20203%20184%20180%20184%20H113%20L72%20216%20V184%20H73%20C50%20184%2035%20168%2035%20145%20V81%20C35%2058%2050%2042%2073%2042Z%22%20stroke-width%3D%2215.8%22%2F%3E%0A%20%20%20%20%20%20%20%20%20%20%3Cpath%20d%3D%22M75%20114%20H165%22%20stroke-width%3D%2219%22%2F%3E%0A%20%20%20%20%20%20%20%20%20%20%3Cpath%20d%3D%22M138%2085%20L168%20114%20L138%20143%22%20stroke-width%3D%2219%22%2F%3E%0A%20%20%20%20%20%20%20%20%20%20%3Cpath%20d%3D%22M76%20145%20H105%22%20stroke-width%3D%2210%22%20opacity%3D%220.7%22%2F%3E%0A%20%20%20%20%20%20%20%20%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--surface:#fff;--ink:#191d24;--muted:#5c6573;--border:#d8dde4;--soft:#f6f8fa;--focus:#b07208;--button:#191d24;--button-text:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding:20px 16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.brand-logo{width:34px;height:34px;flex-shrink:0}
.brand-name{font-size:17px;font-weight:650;letter-spacing:-.03em;line-height:1.3}
.brand-caption{font-size:12px;color:var(--muted);margin-top:1px}
h1{font-size:23px;line-height:1.3;letter-spacing:-.03em;margin:0 0 6px;font-weight:650}
.sub{font-size:13px;color:var(--muted);margin:0 0 18px}
.field{margin-top:16px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
select,input{font:inherit;font-size:16px;width:100%;min-width:0;min-height:44px;padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink)}
input::placeholder{color:var(--muted);opacity:.8}
select:focus,input:focus{outline:none;border-color:var(--focus)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.row{display:flex;gap:10px;align-items:stretch}
.row input{flex:1;width:0}
#sel{margin-top:8px}
button{font:inherit;font-size:14px;font-weight:600;min-height:44px;width:100%;margin-top:20px;padding:9px 14px;color:var(--button-text);background:var(--button);border:1px solid var(--button);border-radius:6px;cursor:pointer;transition:opacity .12s,background .12s}
button:hover{opacity:.85}
button:disabled{opacity:.55;cursor:default}
button.sec{background:var(--soft);border-color:var(--border);color:var(--ink);width:auto;margin:0;flex:0 0 auto}
.password{position:relative}
.hostname{display:flex;align-items:center;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
.hostname:focus-within{border-color:var(--focus)}
.hostname input{flex:1;width:0;border:0;background:transparent}
.hostname span{padding:0 12px;color:var(--muted);font-size:16px}
.password input{padding-right:68px}
button.reveal{position:absolute;right:1px;top:1px;min-height:42px;width:60px;margin:0;padding:0;border:0;background:transparent;color:var(--muted);font-size:13px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0;overflow-wrap:anywhere}
.foot{margin:14px 0 0;font-size:12px;color:var(--muted)}
.msg{margin-top:14px;padding:10px 12px;border:1px solid transparent;border-radius:6px;font-size:13px;display:none;white-space:pre-line;overflow-wrap:anywhere}
.msg.show{display:block}
.msg.info{background:var(--soft);border-color:var(--border);color:var(--muted)}
.msg.ok{background:#edf7f1;border-color:#cce4d4;color:#246b40}
.msg.err{background:#fff2ef;border-color:#eed2cb;color:#a5412d}
@media(max-width:480px){body{place-items:start center;padding:16px 12px}.card{padding:20px}.brand{margin-bottom:18px}}
@media(prefers-color-scheme:dark){:root{--bg:#15181c;--surface:#1e2228;--ink:#e6e8eb;--muted:#a0a8b4;--border:#3a414c;--soft:#272c33;--button:#e6e8eb;--button-text:#191d24;--focus:#c99b46}.msg.ok{background:#1e3327;border-color:#355442;color:#a0d7b4}.msg.err{background:#392622;border-color:#624037;color:#f3b5a5}}
</style>
</head>
<body>
<main class="card">
<header class="brand"><svg class="brand-logo" viewBox="22 28 210 210" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M73 42 H183 C204 42 219 57 219 80 V146 C219 169 203 184 180 184 H113 L72 216 V184 H73 C50 184 35 168 35 145 V81 C35 58 50 42 73 42Z" stroke-width="15.8"/>
          <path d="M75 114 H165" stroke-width="19"/>
          <path d="M138 85 L168 114 L138 143" stroke-width="19"/>
          <path d="M76 145 H105" stroke-width="10" opacity="0.7"/>
        </g></svg><div><div class="brand-name">SMS Forwarding</div><div class="brand-caption">短信转发器</div></div></header>
<h1>连接 WiFi</h1>
<p class="sub">连接 2.4 GHz WiFi，设置设备访问名称。</p>
<form onsubmit="save();return false">
<label for="ssid">WiFi 名称</label>
<div class="row">
<input id="ssid" type="text" placeholder="输入或扫描 WiFi 名称" autocomplete="off" autocapitalize="off" spellcheck="false">
<button class="sec" id="scanBtn" type="button" onclick="scan()">扫描</button>
</div>
<select id="sel" aria-label="附近的网络" hidden><option value="">扫描并选择 WiFi</option></select>
<div class="field"><label for="pass">WiFi 密码</label>
<div class="password"><input id="pass" type="password" placeholder="输入网络密码" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="reveal" id="passToggle" type="button" aria-label="显示 WiFi 密码" aria-pressed="false" onclick="togglePassword()">显示</button></div>
<p class="hint">开放网络可留空。</p>
</div>
<div class="field"><label for="mdnsHost">设备名称（mDNS）</label>
<div class="hostname"><input id="mdnsHost" type="text" value="sms" placeholder="sms" maxlength="32" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="mdnsPreview mdnsHint"><span aria-hidden="true">.local</span></div>
<p class="hint" id="mdnsPreview">访问地址：http://sms.local</p>
<p class="hint" id="mdnsHint">字母、数字或连字符，最多 32 字符。</p></div>
<button id="saveBtn" type="submit">保存并连接</button>
</form>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<p class="foot">连接成功后显示访问地址，并自动关闭热点。</p>
</main>
<script>
function $(i){return document.getElementById(i)}
function togglePassword(){var p=$('pass'),b=$('passToggle');var visible=p.type==='password';p.type=visible?'text':'password';b.textContent=visible?'隐藏':'显示';b.setAttribute('aria-pressed',visible?'true':'false');b.setAttribute('aria-label',visible?'隐藏 WiFi 密码':'显示 WiFi 密码')}
function show(cls,text){var m=$('msg');m.className='msg show '+cls;m.textContent=text}
function clearSel(text){var s=$('sel');var o=document.createElement('option');o.value='';o.textContent=text;s.replaceChildren(o)}
function scan(){
var b=$('scanBtn');b.disabled=true;b.textContent='扫描中';
$('sel').hidden=false;clearSel('扫描中…');
fetch('/wifiscan?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(a){
var s=$('sel');
if(!a||!a.length){clearSel('未发现 WiFi');return}
a.sort(function(x,y){return y.rssi-x.rssi});
var o=document.createElement('option');o.value='';o.textContent='共 '+a.length+' 个，请选择';
s.replaceChildren(o);
a.forEach(function(w){var e=document.createElement('option');e.value=w.ssid;e.textContent=(w.ssid||'(隐藏网络)')+'，'+w.rssi+' dBm'+(w.enc?'，加密':'，开放');s.appendChild(e)});
}).catch(function(){clearSel('扫描失败，请重试')}).finally(function(){b.disabled=false;b.textContent='扫描'});
}
$('sel').onchange=function(){if(this.value){$('ssid').value=this.value;$('pass').focus()}};
var poll=null,timer=null;
var mdnsEdited=false,savedMdnsHost='sms';
function updateMdnsPreview(){var host=$('mdnsHost').value.trim().toLowerCase()||'sms';$('mdnsPreview').textContent='访问地址：http://'+host+'.local'}
$('mdnsHost').oninput=function(){mdnsEdited=true;updateMdnsPreview()};
// 回填已有名称，迟到的请求不得覆盖用户正在编辑或已提交的名称。
fetch('/apstatus?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){if(!mdnsEdited&&!$('saveBtn').disabled&&d.mdnsHost){$('mdnsHost').value=d.mdnsHost;savedMdnsHost=d.mdnsHost;updateMdnsPreview()}}).catch(function(){});
function save(){
if($('saveBtn').disabled)return;
var ssid=$('ssid').value.trim();
if(!ssid){show('err','请输入 WiFi 名称');return}
var host=$('mdnsHost').value.trim().toLowerCase()||'sms';
if(!/^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$/.test(host)){show('err','设备名称需为 1–32 个字母、数字或连字符，首尾不能是连字符。');$('mdnsHost').focus();return}
var b=$('saveBtn');b.disabled=true;b.textContent='连接中…';
mdnsEdited=true;
savedMdnsHost=host;
var body='ssid='+encodeURIComponent(ssid)+'&pass='+encodeURIComponent($('pass').value)+'&mdnsHost='+encodeURIComponent(host);
fetch('/wificonfig',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/x-www-form-urlencoded','X-SMS-CSRF':'1'},body:body}).then(function(r){return r.json()}).then(function(d){
if(!d.success){show('err',d.message||'配置无效');b.disabled=false;b.textContent='保存并连接';return}
if(d.mdnsHost){savedMdnsHost=d.mdnsHost;$('mdnsHost').value=d.mdnsHost;updateMdnsPreview()}
show('info','已保存，正在连接 '+ssid+' …\n切换信道时本页可能短暂断开，会自动恢复，请稍候。');
startPoll();
}).catch(function(){show('info','已提交，正在连接…请稍候。');startPoll()});
}
function startPoll(){
if(poll)clearInterval(poll);
var tries=0;
poll=setInterval(function(){
tries++;
fetch('/apstatus?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
if(d.connected&&d.ip){done(d.ip,d.mdnsHost||savedMdnsHost);return}
}).catch(function(){}).finally(function(){
if(poll&&tries>=24){clearInterval(poll);poll=null;show('err','连接超时，请确认 WiFi 密码是否正确后重试。');var b=$('saveBtn');b.disabled=false;b.textContent='重新连接'}
});
},1500);
}
function done(ip,host){
if(poll){clearInterval(poll);poll=null}
var b=$('saveBtn');b.disabled=true;b.textContent='已连接';
var addresses='http://'+ip+' 或 http://'+(host||savedMdnsHost)+'.local';
var n=15;
show('ok','已连接，请通过 '+addresses+' 进入控制台。\n配网热点将在 '+n+' 秒后自动关闭。');
if(timer)clearInterval(timer);
timer=setInterval(function(){n--;var m=$('msg');if(!m)return;if(n>0){m.textContent='已连接，请通过 '+addresses+' 进入控制台。\n配网热点将在 '+n+' 秒后自动关闭。'}else{m.textContent='配网热点已关闭。请连接你的 WiFi，访问 '+addresses+' 进入控制台。';clearInterval(timer)}},1000);
}
</script>
</body>
</html>
