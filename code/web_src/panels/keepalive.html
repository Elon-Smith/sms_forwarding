<div class="panel" id="panel-keepalive" role="region" aria-label="定时任务">
      <div class="sched-list">
        <div class="sched-task-grid">
          <!-- 保号任务（置顶固定卡） -->
          <form action="/save" method="POST" id="kaForm" class="sched-save-block">
          <div class="push-channel st-task ka-card" id="kaCard">
            <div class="push-channel-header">
              <label class="switch-inline"><input type="checkbox" class="switch-input" name="kaEnabled" id="kaEnabled" aria-label="启用 SIM 保号" onchange="kaSyncHead()"><span class="switch-slider"></span></label>
              <label for="kaEnabled" class="label-inline">SIM 保号</label>
              <span class="schedule-tag" id="kaCountdown" style="margin-left:auto;">--</span>
            </div>
            <div class="push-channel-body">
              <input type="hidden" name="kaProfile" id="kaProfile">
              <div class="form-row">
                <div class="form-group"><label>周期（天）</label><input type="number" id="kaIntervalDays" name="kaIntervalDays" min="1" max="3650" value="175"></div>
                <div class="form-group"><label>动作</label>
                  <select id="kaAction" name="kaAction">
                    <option value="1">蜂窝 HTTP 下载 payload</option>
                    <option value="2">发送短信</option>
                    <option value="3">USSD 查询</option>
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>目标 eSIM 卡（可选）</label>
                  <select id="kaProfileSel" onchange="profSelChange('kaProfile')"></select>
                  <input type="text" id="kaProfileCustom" maxlength="64" placeholder="手动输入 ICCID 或别名" style="display:none;margin-top:8px;" oninput="profSelChange('kaProfile')">
                </div>
                <div class="form-group"><label>目标（短信号码 / USSD 码；HTTP 留空）</label><input type="text" id="kaTarget" name="kaTarget" placeholder="如 10086 或 *122#"></div>
              </div>
              <div class="form-group"><label>保号 URL（HTTP 下载 payload）</label><input type="url" id="kaUrl" name="kaUrl" placeholder="https://gg.incrafttime.top/api/payload?size=64342"></div>
              <div class="st-task-foot">
                <span class="form-hint" style="margin:0;">周期建议小于运营商要求（giffgaff 180 天设 175）；指定卡时保号前自动切换、完成后切回原卡</span>
                <span class="btn-row"><button type="button" class="btn btn-secondary btn-sm" onclick="kaRun()">立即执行</button><button type="button" class="btn btn-secondary btn-sm" onclick="kaReset()">重置基准日</button></span>
              </div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-save">保存 SIM 保号</button>
          </form>

        <!-- 系统定时（每天固定小时执行） -->
        <form action="/save" method="POST" id="systemSchedForm" class="sched-save-block">
        <input type="hidden" name="systemSchedForm" value="1">
        <div class="push-channel sys-card">
          <div class="push-channel-header"><span class="label-inline">每日任务</span></div>
          <div class="push-channel-body">
            <div class="system-task-row">
              <label class="switch-inline"><input type="checkbox" class="switch-input" name="rebootEnabled" %RB_CHECKED%><span class="switch-slider"></span><span>定时重启</span></label>
              <label class="system-task-time"><input class="form-input" type="number" name="rebootHour" value="%RB_HOUR%" min="0" max="23" aria-label="每日重启小时"><span>时</span></label>
            </div>
            <div class="system-task-row">
              <label class="switch-inline"><input type="checkbox" class="switch-input" name="hbEnabled" %HB_CHECKED%><span class="switch-slider"></span><span>心跳通知</span></label>
              <label class="system-task-time"><input class="form-input" type="number" name="hbHour" value="%HB_HOUR%" min="0" max="23" aria-label="每日心跳小时"><span>时</span></label>
            </div>
            <div class="system-task-row">
              <label class="switch-inline"><input type="checkbox" class="switch-input" name="smsHealthEnabled" %SMS_HEALTH_CHECKED%><span class="switch-slider"></span><span>短信组件体检</span></label>
              <label class="system-task-time"><input class="form-input" type="number" name="smsHealthHour" value="%SMS_HEALTH_HOUR%" min="0" max="23" aria-label="每日短信体检小时"><span>时</span></label>
            </div>
            <label class="switch-inline system-task-notify"><input type="checkbox" class="switch-input" name="smsHealthNotify" %SMS_HEALTH_NOTIFY_CHECKED%><span class="switch-slider"></span><span>体检发现异常时推送 / 邮件提醒</span></label>
            <p class="form-hint">按设备本地时间 0–23 时执行，需先同步时间；心跳错过时刻会在当天补发。</p>
            <details class="task-help"><summary>短信体检说明</summary><p class="form-hint">检查注册、PDU、CNMI 和短信存储。异常时先重配复查，仍未恢复则硬重启模组；无法验证运营商是否实际投递新短信。</p></details>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-save">保存系统定时</button>
        </form>
        </div>

        <div class="custom-task-toolbar"><span>自定义任务</span><button type="button" class="btn btn-secondary page-action" id="stAddBtn" onclick="stAddTask()" disabled>+ 添加任务</button></div>
        <p class="form-hint" id="stEmptyHint">可添加最多 6 个周期任务，支持推送、短信、USSD 和 HTTP 下载，也可指定目标 eSIM 卡。</p>
        <!-- 所有槽位保留在表单内；删除最后一个任务后仍需显示保存按钮。 -->
        <form action="/save" method="POST" id="stForm" class="sched-save-block" hidden>
          <div id="stTasks"></div>
          <button type="submit" class="btn btn-primary btn-save">保存自定义任务</button>
        </form>
      </div>
    </div>

    <!-- ===== Diagnostics & Control ===== -->
