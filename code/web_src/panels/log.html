<div class="panel" id="panel-log" role="region" aria-label="系统日志">
      <div class="card console-card log-console">
        <div class="card-header">运行日志<span class="console-header-action log-status" id="logStatus" role="status" aria-live="polite"></span></div>
        <div class="card-body console-body">
          <div class="log-toolbar">
            <button class="btn btn-secondary btn-sm" onclick="clearLogUI()">清空显示</button>
            <button class="btn btn-secondary btn-sm" onclick="reloadLog()">重新加载</button>
            <button class="btn btn-secondary btn-sm" onclick="copyLogAll(this)">复制全部</button>
            <button class="btn btn-secondary btn-sm" onclick="location.href='/logdownload'">下载日志</button>
            <label class="switch-inline log-auto"><span>自动刷新</span><input type="checkbox" class="switch-input" id="logAuto" checked onchange="toggleLogAuto()"><span class="switch-slider"></span></label>
          </div>
          <div id="logView" tabindex="0" aria-label="设备运行日志">加载中...</div>
          <p class="form-hint">设备在内存中保留最近 120 条日志（重启清空），本页打开期间会持续累积新日志。</p>
          <details class="config-disclosure log-archive">
            <summary>上次运行日志与崩溃诊断</summary>
          <div class="log-toolbar">
            <button class="btn btn-secondary btn-sm" onclick="loadPrevLog(this)">加载上次日志</button>
            <button class="btn btn-secondary btn-sm" onclick="location.href='/prevlog?dl=1'">下载上次日志</button>
            <button class="btn btn-secondary btn-sm" onclick="location.href='/coredump'">下载崩溃转储</button>
            <button class="btn btn-secondary btn-sm" onclick="clearCoredump(this)">清除崩溃转储</button>
          </div>
          <div id="prevLogView" class="log-view-secondary" tabindex="0" aria-label="上次运行日志">点击“加载上次日志”读取重启前记录</div>
          <p class="form-hint">重启前的日志会自动保留在内存中（软件重启/看门狗/崩溃后仍可查看）；异常复位时会在启动完成后后台写入 Flash，但只有点击加载或下载时才读取。崩溃转储（coredump）可用 espcoredump.py 解析完整回溯定位崩溃点。</p>
          </details>
        </div>
      </div>
    </div>
