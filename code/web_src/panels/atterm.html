<div class="panel" id="panel-atterm" role="region" aria-label="AT 指令终端">
      <div class="card console-card at-console">
        <div class="card-header">AT 终端<button type="button" class="btn btn-secondary btn-sm console-header-action" onclick="clearATLog()">清空输出</button></div>
        <div class="card-body console-body">
          <div class="at-chips">
            <button type="button" class="at-chip" onclick="atQuick('AT+CSQ')">信号</button>
            <button type="button" class="at-chip" onclick="atQuick('AT+CEREG?')">注册状态</button>
            <button type="button" class="at-chip" onclick="atQuick('AT+COPS?')">运营商</button>
            <button type="button" class="at-chip" onclick="atQuick('AT+CGPADDR=1')">PDP IP</button>
            <button type="button" class="at-chip" onclick="atQuick('AT+CPMS?')">短信存储</button>
            <button type="button" class="at-chip" onclick="atQuick('AT+CGSN')">模组序列号</button>
            <button type="button" class="at-chip" onclick="atQuick('AT+CGSN=1')">IMEI</button>
          </div>
          <div id="atLog" tabindex="0" aria-label="AT 指令响应">就绪 — 输入 AT 指令开始调试</div>
          <div class="console-command">
            <label class="form-label" for="atCmd">AT 指令</label>
            <div class="at-bar"><input class="form-input" type="text" id="atCmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入指令，例如 AT+CSQ"><button type="button" class="btn btn-primary" onclick="sendAT()" id="atBtn">发送</button></div>
            <p class="form-hint">Enter 发送 · ↑ / ↓ 翻阅历史。指令直接发往模组，操作前请确认用途。</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== System Log ===== -->
