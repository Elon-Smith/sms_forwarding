</head>
<body>
<aside class="sidebar">
    <div class="sidebar-brand">
      <svg class="brand-logo" viewBox="22 28 210 210" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M73 42 H183 C204 42 219 57 219 80 V146 C219 169 203 184 180 184 H113 L72 216 V184 H73 C50 184 35 168 35 145 V81 C35 58 50 42 73 42Z" stroke-width="15.8"/>
          <path d="M75 114 H165" stroke-width="19"/>
          <path d="M138 85 L168 114 L138 143" stroke-width="19"/>
          <path d="M76 145 H105" stroke-width="10" opacity="0.7"/>
        </g></svg>
      <h2>双卡短信转发器</h2>
    </div>
    <div class="sim-picker"><label for="simSelect">当前操作模组</label><select id="simSelect" onchange="selectSim(this.value)"><option value="1">SIM1 · UART1</option><option value="2">SIM2 · UART0</option></select><small>网络、短信、保号和诊断按所选卡执行</small></div>
    <nav class="sidebar-nav">
      <a href="#overview" title="系统概览" data-panel="overview" class="active"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span> <span>系统概览</span></a>
      <a href="#sim" title="网络设置" data-panel="sim"><span class="ico"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V8l5-5h9a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2z"/><rect x="8" y="13" width="8" height="5" rx="1"/></svg></span> <span>网络设置</span></a>
      <a href="#inbox" title="收发短信" data-panel="inbox"><span class="ico"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span> <span>收发短信</span></a>
      <a href="#push" title="转发设置" data-panel="push"><span class="ico"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></span> <span>转发设置</span></a>
      <a href="#keepalive" title="定时任务" data-panel="keepalive"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="12" cy="15" r="3"/></svg></span> <span>定时任务</span></a>
      <a href="#settings" title="系统设置" data-panel="settings"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span> <span>系统设置</span></a>
      <a href="#atterm" title="AT 终端" data-panel="atterm"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg></span> <span>AT 终端</span></a>
      <a href="#log" title="系统日志" data-panel="log"><span class="ico"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 12h8M8 16h8"/></svg></span> <span>系统日志</span></a>
    </nav>
    <!-- 主题切换已移除：固定浅色 -->
  </aside>
  <main class="main" id="panelHost">
    <div class="msg-empty" id="panelLoading">加载中...</div>
  </main>
<!-- ===== 发短信 弹窗 ===== -->
    <div class="modal-overlay" id="smsModal" onclick="if(event.target===this)closeSmsModal()">
      <div class="modal">
        <div class="modal-head"><span>发送短信</span><button class="modal-x" onclick="closeSmsModal()" aria-label="关闭">&times;</button></div>
        <div class="form-group"><label class="form-label">目标号码</label><input class="form-input" type="text" id="smsPhone" placeholder="+447700900456"></div>
        <div class="form-group"><label class="form-label">短信内容</label><textarea class="form-textarea" id="smsContent" placeholder="输入短信内容..." oninput="updateCount(this)"></textarea><p class="form-hint">已输入 <span id="charCount">0</span> 字符</p></div>
        <div class="result-box" id="smsSendResult"></div>
        <div class="modal-foot"><button class="btn btn-secondary" onclick="closeSmsModal()">取消</button><button class="btn btn-primary" id="smsSendBtn" onclick="sendSmsModal()">发送</button></div>
      </div>
    </div>
  <div class="drawer-bg" id="drawerBg" onclick="closeMsgDrawer()"></div>
  <aside class="msg-drawer" id="msgDrawer">
    <div class="dh">短信详情<button class="x" onclick="closeMsgDrawer()">&times;</button></div>
    <div class="db" id="drawerBody"></div>
  </aside>
  <script src="/assets/app.js?v={{ASSET_HASH}}" defer></script>
</body>
</html>
